name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: SoloLeveling-Mod
          path: build/libs/*.jar
